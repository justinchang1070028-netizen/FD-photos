[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fire-inspector"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "discord-py>=2.7.1",
    "openpyxl>=3.1.5",
    "pillow>=13.0.0",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "tzdata>=2026.5",
]

[project.scripts]
fire-inspector = "fire_inspector.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fire_inspector"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
